<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Khadamat — e-Services Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Static hosting fallback: pick Arabic or English from the browser language. -->
    <script>
      var lang = (navigator.language || "ar").toLowerCase().indexOf("en") === 0 ? "en" : "ar";
      location.replace("./" + lang + "/");
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./ar/" /></noscript>
  </head>
  <body>
    <a href="./ar/">العربية</a> · <a href="./en/">English</a>
  </body>
</html>
